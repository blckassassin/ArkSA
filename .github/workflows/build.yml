name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE: ferment9348/ark-survival-ascended

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck and python3 are both preinstalled on ubuntu-latest; installing
      # shellcheck from apt just added a slow, flaky step.
      - name: Lint the scripts
        run: |
          shellcheck --severity=warning scripts/*.sh
          python3 -m py_compile scripts/rcon.py

      - uses: docker/setup-buildx-action@v4

      # amd64 only: SteamCMD pulls a Windows x86_64 depot that runs under Proton,
      # so an arm64 image would build and then be unable to run the server.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
          # Without these, metadata-action derives title/description from the
          # repo and overwrites the Dockerfile's, leaving the description empty.
          labels: |
            org.opencontainers.image.title=ARK: Survival Ascended Dedicated Server
            org.opencontainers.image.description=ASA dedicated server (Windows binary via GE-Proton), SteamCMD-based, Unraid friendly. Inspired by ich777/steamcmd.

      # Only tags publish. Pushes to main and pull requests build and stop, so
      # :latest is always a release that was cut deliberately.
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Docker Hub page is otherwise blank, and Community Apps links to it.
      - name: Sync the Docker Hub description
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "ARK: Survival Ascended dedicated server for Unraid — SteamCMD + GE-Proton"
          readme-filepath: ./README.md

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
